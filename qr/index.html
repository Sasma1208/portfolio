<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stephenasma.com – QR Code</title>
    <meta name="description" content="Scan this QR code to visit stephenasma.com">
    <meta name="robots" content="noindex, nofollow">

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.4;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .qr-page {
            width: 100%;
            max-width: 640px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .qr-link {
            display: block;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            text-decoration: none;
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .qr-link:hover,
        .qr-link:focus-visible {
            transform: scale(1.01);
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.15);
        }

        .qr-image {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: #ffffff;
            border-radius: 8px;
        }

        .qr-image.is-error {
            display: none;
        }

        .qr-fallback {
            display: none;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            color: #000000;
        }

        .qr-image.is-error + .qr-fallback {
            display: block;
        }

        .url-display {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-weight: bold;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            color: #000000;
            text-decoration: none;
            letter-spacing: 1px;
            word-break: break-all;
        }

        .url-display:hover,
        .url-display:focus-visible {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        @media (max-width: 480px) {
            .qr-page {
                gap: 16px;
            }

            .qr-link {
                padding: 12px;
                border-radius: 12px;
            }

            .url-display {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <main class="qr-page" aria-labelledby="page-title">
        <h1 id="page-title" class="sr-only">QR code for stephenasma.com</h1>

        <a
            class="qr-link"
            href="https://stephenasma.com"
            aria-label="Scan QR code or click to visit stephenasma.com"
        >
            <img
                class="qr-image"
                src="https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&data=https%3A%2F%2Fstephenasma.com"
                alt="QR code linking to stephenasma.com"
                loading="eager"
                onerror="this.classList.add('is-error')"
            />
            <div class="qr-fallback" role="alert">
                <p>QR code could not be loaded.</p>
                <p>Please visit <a href="https://stephenasma.com">stephenasma.com</a> directly.</p>
            </div>
        </a>

        <a class="url-display" href="https://stephenasma.com">stephenasma.com</a>
    </main>

    <script>
        // Remove error state if the image loads successfully (e.g., after a retry)
        document.querySelector('.qr-image').addEventListener('load', function () {
            this.classList.remove('is-error');
        });
    </script>
</body>
</html>
